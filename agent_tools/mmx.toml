# mmx config: how `mmx export` / `mmx run` call Material Maker. Shared defaults, committed.
# Machine-specific paths go in agent_tools/mmx.local.toml (gitignored; written by agent_tools/setup.py), which
# is merged on top of this file. $MMX_CONFIG or --config replaces both. Paths must be absolute; "" = auto.

mode = "source"         # "source": Godot + this repo (parse_args.gd: --json, exit codes, --size).
                        # "release": the installed app (no --size, no JSON, always exits 0).
target = "Unity/URP"    # default --target
timeout = 180           # seconds before a hung export is killed (a normal export takes ~5-11 s)
preview_3d = true       # `mmx run` also renders iter_NNN/preview_3d.png (engine --render-preview; ~3 s; source mode)
preview_mesh = "sphere+plane"   # mmx preview / run defaults: keep them fixed so iterations stay comparable
preview_env = "Studio"
preview_size = 512              # pixels per view
validate_engine = true  # `mmx validate` also runs the engine's --validate (shader compile; ~2 s; source mode)

[release]
binary = "/Applications/Material Maker.app/Contents/MacOS/Material Maker"
data_dir = "/Applications/Material Maker.app/Contents/MacOS"   # nodes/ used to predict output files

[source]
godot = ""              # Godot 4.7 executable; "" = auto-detect ($MMX_GODOT, godot on PATH, /Applications/Godot*.app)
project = ""            # "" = this repo

[unity]
editor = ""             # for to-unity --verify; "" = the Unity Hub editor matching the project's version
project = ""            # default --project (set it in mmx.local.toml)
verify_timeout = 900    # seconds; the first batchmode launch imports the whole project
